name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      subscription_id:
        description: 'Azure Subscription Id'
        required: true
        type: string
      tenant_id:
        description: 'Azure Tenant Id'
        required: true
        type: string
      application_id:
        description: 'Azure Application Id'
        required: true
        type: string
      application_password:
        description: 'Azure Application Password'
        required: true
        type: string
      azure_registry_name:
        description: 'Azure Registry Name'
        required: true
        type: string
      azure_repo_name:
        description: 'Azure Repo Name'
        required: true
        type: string
      docker_image_name:
        description: 'Docker image name'
        required: true
        type: string
      docker_image_tag:
        description: 'Docker image tag'
        required: true
        type: string
      acr_docker_image_tag:
        description: 'Azure docker image tag'
        required: true
        type: string
      opsera_pipeline_id:
        description: 'Opsera pipeline id'
        required: true
        type: string
      opsera_step_id:
        description: 'Opsera step id'
        required: true
        type: string
      opsera_pipeline_run_count:
        description: 'Opsera pipeline run count'
        required: true
        type: string
      file_name:
        description: 'Opsera docker file name tar'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Azure Login
      env:
        AZURE_SUBSCRIPTION_ID: ${{ github.event.inputs.subscription_id }}
        AZURE_TENANT_ID: ${{ github.event.inputs.tenant_id }}
        AZURE_CLIENT_ID: ${{ github.event.inputs.application_id }}
        AZURE_CLIENT_SECRET: ${{ github.event.inputs.application_password }}
      run: |
        az login --service-principal --username $AZURE_CLIENT_ID --tenant $AZURE_TENANT_ID --password $AZURE_CLIENT_SECRET

    - name: Azure Container Registry Login
      env:
        AZURE_REGISTRY_NAME: ${{ github.event.inputs.azure_registry_name }}
      run: az acr login --name $AZURE_REGISTRY_NAME

    - name: Load Docker Image
      env:
        FILE_NAME: ${{ github.event.inputs.file_name }}
      run: docker load --input /home/runner/work/${{ github.event.inputs.file_name }}.tar

    - name: Tag Docker Image
      env:
        DOCKER_IMAGE_NAME: ${{ github.event.inputs.docker_image_name }}
        DOCKER_IMAGE_TAG: ${{ github.event.inputs.docker_image_tag }}
        AZURE_REGISTRY_NAME: ${{ github.event.inputs.azure_registry_name }}
        AZURE_REPO_NAME: ${{ github.event.inputs.azure_repo_name }}
        ACR_DOCKER_IMAGE_TAG: ${{ github.event.inputs.acr_docker_image_tag }}
      run: docker tag $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG $AZURE_REGISTRY_NAME.azurecr.io/$AZURE_REPO_NAME:$ACR_DOCKER_IMAGE_TAG

    - name: Push Docker Image
      env:
        AZURE_REGISTRY_NAME: ${{ github.event.inputs.azure_registry_name }}
        AZURE_REPO_NAME: ${{ github.event.inputs.azure_repo_name }}
        ACR_DOCKER_IMAGE_TAG: ${{ github.event.inputs.acr_docker_image_tag }}
      run: docker push $AZURE_REGISTRY_NAME.azurecr.io/$AZURE_REPO_NAME:$ACR_DOCKER_IMAGE_TAG
